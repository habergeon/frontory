<!doctype html>
<html lang="ko">
  <meta charset="utf-8" /><meta
    name="viewport"
    content="width=device-width,initial-scale=1"
  /><title>자막과 대본 실험</title
  ><style>
    body{font:18px system-ui;max-width:48rem;margin:2rem auto}video{max-width:100%}
  </style>
  <h1>미디어 자막과 대체 경로</h1>
  <video id="video" controls width="640" height="360">
    <source src="sample.mp4" type="video/mp4" />
    <track
      src="captions.vtt"
      kind="captions"
      srclang="ko"
      label="한국어"
      default
    />
    영상 재생을 지원하지 않습니다.
  </video>
  <p>
    <button id="fail">없는 파일로 전환</button>
    <button id="restore">정상 파일 복원</button>
  </p>
  <output id="status" aria-live="polite">재생 버튼을 누르세요.</output>
  <p><a href="transcript.html">대본 읽기</a></p>
  <script>
    const video=document.querySelector('video'),source=video.querySelector('source'),status=document.querySelector('output');document.querySelector('#fail').onclick=()=>{source.src='missing.mp4';video.load();status.textContent='실패 경로 요청: 대본 링크를 사용하세요.'};document.querySelector('#restore').onclick=()=>{source.src='sample.mp4';video.load()};source.addEventListener('error',()=>status.textContent='영상 파일을 불러오지 못했습니다. 대본을 읽을 수 있습니다.');video.addEventListener('loadedmetadata',()=>status.textContent='정상 영상: '+video.duration.toFixed(1)+'초 / 자막 메뉴에서 한국어를 선택하세요.');
  </script>
</html>
