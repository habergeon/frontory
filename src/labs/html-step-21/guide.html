<!doctype html>
<html lang="ko">
  <meta charset="utf-8" /><title>포함 안내</title>
  <h2>학습 안내</h2>
  <p id="state">정적 HTML 표시: 스크립트 실행 전</p>
  <button id="count">카운터 0</button>
  <script>
    document.querySelector('#state').textContent='스크립트 실행됨';let count=0;document.querySelector('button').onclick=event=>event.target.textContent='카운터 '+(++count);parent.postMessage({type:'guide-ready',scriptExecuted:true},'*');
  </script>
</html>
