<!doctype html>
<html lang="en">
  <meta charset="utf-8" /><title>Learning notes fixture</title
  ><style>
    body{font:16px system-ui;max-width:720px;margin:24px}nav{display:flex;gap:12px}textarea{display:block;width:90%;height:100px}section{padding:20px;background:#eef5fc}button{padding:8px;margin:5px}
  </style>
  <nav aria-label="Lessons">
    <button data-unit="a">Lesson A</button
    ><button data-unit="b">Lesson B</button>
  </nav>
  <main>
    <h1>Lesson A</h1>
    <section aria-label="Notes">
      <label>Notes<textarea></textarea></label
      ><button id="save">Save notes</button
      ><button id="download">Download backup</button
      ><label
        >Import backup<input type="file" accept="application/json" /></label
      ><output role="status">Ready</output>
    </section>
    <button id="docs">Load document</button
    ><button id="next">Load newer document</button>
    <article aria-label="Document"></article>
  </main>
  <script>
    const input=document.querySelector('textarea'),status=document.querySelector('output'),doc=document.querySelector('article');let unit='a',generation=0,timer;
    const read=()=>{input.value=localStorage.getItem('note:'+unit)||''};read();
    const save=()=>{localStorage.setItem('note:'+unit,input.value);status.textContent='Saved'};
    input.oninput=()=>{clearTimeout(timer);status.textContent='Unsaved';timer=setTimeout(save,500)};
    document.querySelector('#save').onclick=()=>{clearTimeout(timer);save()};
    document.querySelectorAll('[data-unit]').forEach(b=>b.onclick=()=>{clearTimeout(timer);unit=b.dataset.unit;document.querySelector('h1').textContent=b.textContent;read()});
    document.querySelector('#download').onclick=()=>{const url=URL.createObjectURL(new Blob([JSON.stringify({version:1,text:input.value})],{type:'application/json'}));const a=document.createElement('a');a.href=url;a.download='notes.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};
    document.querySelector('input[type=file]').onchange=async e=>{try{const data=JSON.parse(await e.target.files[0].text());if(data.version!==1||typeof data.text!=='string')throw Error('schema');clearTimeout(timer);input.value=data.text;save();status.textContent='Imported'}catch{status.textContent='Invalid backup; existing note preserved'}};
    const load=async id=>{const mine=++generation;doc.textContent='Loading';try{const response=await fetch('/docs/'+id);if(!response.ok)throw Error('HTTP '+response.status);const text=await response.text();doc.dataset.completed=id;if(mine===generation)doc.textContent=text}catch(e){if(mine===generation)doc.textContent=String(e)}};
    document.querySelector('#docs').onclick=()=>load('old');document.querySelector('#next').onclick=()=>load('new');
  </script>
</html>
