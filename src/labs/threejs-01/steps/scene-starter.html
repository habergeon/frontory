<!doctype html>
<html lang="ko">
  <meta charset="utf-8" />
  <title>장면 구조 실험</title>
  <p id="count"></p>
  <script type="module">
    import { Scene, Object3D } from 'three'
    const scene = new Scene()
    // 이곳에서 장면에 Object3D를 추가하세요.
    document.querySelector('#count').textContent = String(scene.children.length)
  </script>
</html>
